<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NullNX — Capability Deck</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020408; --panel:#060d10; --nx:#00ffcc; --nx2:#00cc99;
  --cr:#c81f3f; --rb:#3f56c8; --dim:#4a6a6a; --warn:#ffaa00;
  --parch:#e8f4f0;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--nx);font-family:'JetBrains Mono',monospace;}
body{min-height:100vh;}

/* header */
.header{text-align:center;padding:36px 20px 16px;border-bottom:1px solid #0a2020;}
.header h1{font-family:'Cinzel',serif;font-size:clamp(1.6rem,4vw,2.8rem);margin:0;color:var(--nx);text-shadow:0 0 30px rgba(0,255,204,.4);letter-spacing:.08em;}
.header .sub{color:var(--dim);font-size:.85rem;margin-top:8px;max-width:70ch;margin-left:auto;margin-right:auto;}
.genesis-display{margin:16px auto;font-family:'Cinzel',serif;font-size:clamp(2rem,6vw,4.5rem);color:var(--nx);text-shadow:0 0 40px rgba(0,255,204,.6),0 0 80px rgba(0,255,204,.2);animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{text-shadow:0 0 20px rgba(0,255,204,.4);}50%{text-shadow:0 0 60px rgba(0,255,204,.9),0 0 120px rgba(0,255,204,.4);}}
.constants{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:12px;}
.const-pill{border:1px solid var(--dim);padding:4px 12px;border-radius:12px;font-size:.75rem;color:var(--dim);}
.const-pill b{color:var(--nx);}

/* grid */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;padding:28px 20px 80px;max-width:1400px;margin:0 auto;}

/* card */
.card{aspect-ratio:5/7;perspective:1000px;cursor:pointer;}
.card .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.3,1);animation:bspin var(--spd,9s) linear infinite;}
.card.flipped .inner{transform:rotateY(180deg)!important;animation:none!important;}
@keyframes bspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.face{position:absolute;inset:0;border-radius:8px;border:1px solid var(--nx2);background:var(--panel);box-shadow:0 0 12px rgba(0,255,204,.15),inset 0 0 20px rgba(0,40,30,.5);backface-visibility:hidden;overflow:hidden;}
.face svg{width:100%;height:100%;display:block;}
.ftitle{position:absolute;bottom:0;left:0;right:0;padding:7px 8px 9px;background:linear-gradient(0deg,rgba(2,4,8,.95),transparent);font-size:.7rem;}
.ftitle .marker{color:var(--warn);display:block;font-size:.62rem;letter-spacing:.06em;}
.ftitle b{color:var(--parch);display:block;font-size:.82rem;font-family:'Cinzel',serif;letter-spacing:.02em;}
.ftitle i{color:var(--dim);font-style:italic;font-size:.68rem;font-family:'JetBrains Mono',monospace;}

/* card back */
.back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:10px;font-size:.72rem;}
.back .btitle{font-family:'Cinzel',serif;font-size:.82rem;color:var(--parch);border-bottom:1px dashed var(--nx2);padding-bottom:5px;margin-bottom:6px;}
.back .bdesc{color:var(--dim);flex:1;overflow:auto;line-height:1.5;}
.back .bdesc b{color:var(--nx);}
.back .demo{margin-top:6px;border:1px solid #0a2020;background:#020408;padding:6px;font-size:.68rem;border-radius:3px;}
.back .demo .stream{color:var(--warn);word-break:break-all;line-height:1.6;}
.back .demo .expand{color:var(--nx);margin-top:3px;}
.back .mbtn{font-family:'JetBrains Mono',monospace;font-size:.62rem;background:transparent;border:1px solid var(--nx2);color:var(--nx);padding:3px 8px;border-radius:3px;cursor:pointer;margin-top:4px;width:100%;}
.back .mbtn:hover{background:#0a2020;}
.ratio{color:var(--cr);font-weight:600;}
.ok{color:var(--nx);}
.warn{color:var(--warn);}

/* filter bar */
.filterbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 20px 4px;}
.fbtn{font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:5px 12px;border:1px solid var(--dim);background:transparent;color:var(--dim);border-radius:14px;cursor:pointer;}
.fbtn.on{border-color:var(--nx);color:var(--nx);background:#0a2020;}
</style>
</head>
<body>

<div class="header">
  <div class="genesis-display">·</div>
  <h1>NullNX — CAPABILITY DECK</h1>
  <p class="sub">A single genesis point expands to a full 60-node fullerene supercompute graph. Each card is one capability of the stream. Flip any card to see the live byte math.</p>
  <div class="constants">
    <span class="const-pill">VERTICES <b>60</b></span>
    <span class="const-pill">EDGES <b>90</b></span>
    <span class="const-pill">PENTAGONS <b>12</b></span>
    <span class="const-pill">HEXAGONS <b>20</b></span>
    <span class="const-pill">STRUCTURAL CONST <b>252</b></span>
    <span class="const-pill">GENESIS <b>0x00</b></span>
  </div>
</div>

<div class="filterbar" id="filterbar"></div>
<div class="deck" id="deck"></div>

<script>
/* ---- SVG helpers ---- */
const NX='#00ffcc', NX2='#00cc99', CR='#c81f3f', RB='#3f56c8', WN='#ffaa00', DIM='#4a6a6a';
function wrap(inner,vb='0 0 190 266'){return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#060d10"/>${inner}</svg>`;}
function hex6(cx,cy,r){let p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);}return p.join(' ');}

/* tessellation generators */
function tGenesis(){
  let s='';
  for(let r=0;r<9;r++){
    const radius=r*14+5, op=Math.max(.08,1-r*.1);
    const c=r%2?NX2:NX;
    s+=`<circle cx="95" cy="133" r="${radius}" fill="none" stroke="${c}" stroke-width="${r===0?2:1}" opacity="${op}"/>`;
  }
  for(let ring=1;ring<6;ring++){
    const n=ring*5, R=ring*16;
    for(let i=0;i<n;i++){
      const a=(2*Math.PI*i/n), x=95+R*Math.cos(a), y=133+R*Math.sin(a);
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${ring%2?NX:CR}" opacity="${0.6+ring*.06}"/>`;
    }
  }
  s+=`<circle cx="95" cy="133" r="4" fill="${NX}"/><text x="95" y="137" text-anchor="middle" fill="#fff" font-size="5" font-family="monospace">0x00</text>`;
  return wrap(s);
}
function tExpand(){
  let s='';
  const cx=95,cy=133,r=12;
  const pts=[];
  pts.push([cx,cy]);
  for(let i=0;i<6;i++){const a=Math.PI/3*i;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  for(let i=0;i<12;i++){const a=Math.PI/6*i, R=r*2.1;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  for(let i=0;i<18;i++){const a=Math.PI/9*i, R=r*3.2;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  pts.forEach(([px,py],i)=>{
    const d=Math.hypot(px-cx,py-cy), op=Math.max(.2,1-d/80);
    s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${i===0?4:2}" fill="${i===0?NX:i<7?NX2:CR}" opacity="${op}"/>`;
  });
  for(let a=0;a<6;a++){const ang=Math.PI/3*a, x=cx+55*Math.cos(ang),y=cy+55*Math.sin(ang);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${WN}" stroke-width=".7" opacity=".3" stroke-dasharray="3,3"/>`;}
  return wrap(s);
}
function tRLE(){
  let s='';
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const x=10+j*22, y=20+i*22;
    s+=`<rect x="${x}" y="${y}" width="18" height="18" rx="2" fill="${(i+j)%7===0?CR:'#0a2020'}" opacity="${.4+((i*j)%5)*.1}" stroke="${DIM}" stroke-width=".5"/>`;
    if(i===0)s+=`<text x="${x+9}" y="${y+12}" text-anchor="middle" font-size="7" font-family="monospace" fill="${NX}" opacity=".7">01</text>`;
  }
  s+=`<rect x="20" y="200" width="150" height="40" rx="4" fill="#0a2020" stroke="${NX}" stroke-width="1"/>`;
  s+=`<text x="95" y="217" text-anchor="middle" font-size="9" font-family="monospace" fill="${WN}">FE 3C 01</text>`;
  s+=`<text x="95" y="231" text-anchor="middle" font-size="7" font-family="monospace" fill="${NX2}">3 bytes → 60 NODEs</text>`;
  s+=`<text x="95" y="193" text-anchor="middle" font-size="8" font-family="monospace" fill="${DIM}">120 bytes raw ↓</text>`;
  return wrap(s);
}
function tDefPattern(){
  let s='';
  const penta=(cx,cy,r,c)=>{let pts=[];for(let i=0;i<5;i++){const a=Math.PI/180*(72*i-90);pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);};return `<polygon points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="1.2"/>`;};
  s+=`<rect x="10" y="10" width="80" height="70" rx="3" fill="#0a2020" stroke="${WN}" stroke-width="1"/>`;
  s+=penta(50,42,28,NX);
  s+=`<text x="50" y="72" text-anchor="middle" font-size="7" fill="${WN}">DEF_PATTERN 0x01</text>`;
  const positions=[[140,40],[140,90],[140,140],[140,190],[140,240],[95,240],[50,240],[15,240],[15,190],[15,140],[15,90],[95,40]];
  positions.forEach(([px,py])=>{ s+=`<rect x="${px-15}" y="${py-15}" width="30" height="30" rx="3" fill="#020408" stroke="${NX2}" stroke-width=".8"/>`; s+=penta(px,py,11,NX2); });
  s+=`<text x="95" y="200" text-anchor="middle" font-size="7" fill="${DIM}">× 12 REF_PATTERN</text>`;
  positions.slice(0,3).forEach(([px,py])=>{ s+=`<line x1="90" y1="42" x2="${px-15}" y2="${py}" stroke="${WN}" stroke-width=".5" opacity=".4" stroke-dasharray="2,2"/>`; });
  return wrap(s);
}
function tHexGrid(){
  let s='';
  const r=14, dx=r*Math.sqrt(3), dy=r*1.5;
  for(let row=-1;row<9;row++) for(let col=-1;col<6;col++){
    const cx=col*dx+(row%2?dx/2:0), cy=row*dy;
    const d=Math.hypot(cx-80,cy-110), op=Math.max(.08,1-d/130);
    const c=(row+col)%3===0?NX:(row+col)%3===1?CR:RB;
    s+=`<polygon points="${hex6(cx,cy,r-1.5)}" fill="${c}" opacity="${(op*.5).toFixed(2)}" stroke="${c}" stroke-width=".4" stroke-opacity=".4"/>`;
  }
  return wrap(s);
}
function tSoliton(n=120,ang=137.5){
  let s='';
  const a=ang*Math.PI/180;
  for(let i=0;i<n;i++){
    const r=3.8*Math.sqrt(i), t=i*a, x=95+r*Math.cos(t), y=133+r*Math.sin(t);
    const c=i%2?NX:CR;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.5+i*.015).toFixed(2)}" fill="${c}" opacity=".75"/>`;
  }
  return wrap(s);
}
function tBinaryStream(){
  let s='';
  const bytes=['10','2E','11','26','00','69','00','11','27','01','6A','00','12','FE','3C','01','FD','05','FC','05'];
  bytes.forEach((b,i)=>{
    const x=10+(i%5)*36, y=20+Math.floor(i/5)*52;
    const highlight=['10','11','12','FE','FD','FC'].includes(b);
    s+=`<rect x="${x}" y="${y}" width="32" height="38" rx="3" fill="${highlight?'#0a2020':'#060d10'}" stroke="${highlight?NX:DIM}" stroke-width="${highlight?1:.5}"/>`;
    s+=`<text x="${x+16}" y="${y+18}" text-anchor="middle" font-size="11" font-family="monospace" fill="${highlight?WN:NX2}">${b}</text>`;
    s+=`<text x="${x+16}" y="${y+30}" text-anchor="middle" font-size="6" font-family="monospace" fill="${DIM}">${highlight?'CMD':'data'}</text>`;
  });
  return wrap(s);
}
function tDelta(){
  let s='';
  const frame1=[20,25,25,28,30,25,22,20];
  const frame2=[20,25,26,28,30,24,22,21];
  frame1.forEach((v,i)=>{
    const x=15+i*21, y=200-v*4, h=v*4;
    s+=`<rect x="${x}" y="${y}" width="16" height="${h}" fill="${RB}" opacity=".4"/>`;
  });
  frame2.forEach((v,i)=>{
    const x=15+i*21, y=200-v*4, h=v*4, changed=v!==frame1[i];
    s+=`<rect x="${x}" y="${y}" width="16" height="${h}" fill="${changed?NX:DIM}" opacity="${changed?.8:.2}"/>`;
    if(changed)s+=`<text x="${x+8}" y="${y-4}" text-anchor="middle" font-size="7" fill="${WN}">Δ</text>`;
  });
  s+=`<text x="95" y="215" text-anchor="middle" font-size="8" fill="${DIM}">only changed bytes transmitted</text>`;
  s+=`<text x="95" y="228" text-anchor="middle" font-size="9" fill="${NX}">8 bytes → 2 DELTA bytes</text>`;
  for(let i=0;i<8;i++){const x=15+i*21; s+=`<rect x="${x}" y="20" width="16" height="16" rx="2" fill="#0a2020" stroke="${DIM}" stroke-width=".5"/>`;s+=`<text x="${x+8}" y="31" text-anchor="middle" font-size="7" fill="${NX}">FA</text>`;}
  s+=`<text x="95" y="50" text-anchor="middle" font-size="7" fill="${WN}">DELTA opcodes (0xFA)</text>`;
  return wrap(s);
}
function tJNI(){
  let s='';
  s+=`<rect x="15" y="20" width="160" height="60" rx="4" fill="#0a1520" stroke="${RB}" stroke-width="1.2"/>`;
  s+=`<text x="95" y="42" text-anchor="middle" font-size="10" fill="${RB}" font-family="monospace">Java Engine</text>`;
  s+=`<text x="95" y="57" text-anchor="middle" font-size="8" fill="${DIM}">NullNXBridge.java</text>`;
  s+=`<text x="95" y="70" text-anchor="middle" font-size="7" fill="${DIM}">parseStream() · createManager()</text>`;
  s+=`<rect x="55" y="100" width="80" height="36" rx="4" fill="#0a2010" stroke="${NX}" stroke-width="1.5"/>`;
  s+=`<text x="95" y="119" text-anchor="middle" font-size="9" fill="${NX}">JNI BRIDGE</text>`;
  s+=`<text x="95" y="130" text-anchor="middle" font-size="7" fill="${DIM}">jlong · jstring · jint</text>`;
  s+=`<rect x="15" y="156" width="160" height="60" rx="4" fill="#1a0a10" stroke="${CR}" stroke-width="1.2"/>`;
  s+=`<text x="95" y="178" text-anchor="middle" font-size="10" fill="${CR}" font-family="monospace">C++ NullNX Core</text>`;
  s+=`<text x="95" y="193" text-anchor="middle" font-size="8" fill="${DIM}">null_nx_core.cpp</text>`;
  s+=`<text x="95" y="207" text-anchor="middle" font-size="7" fill="${DIM}">parse_stream() · serialize()</text>`;
  s+=`<line x1="95" y1="80" x2="95" y2="100" stroke="${NX}" stroke-width="1.5" marker-end="url(#arr)"/>`;
  s+=`<line x1="95" y1="136" x2="95" y2="156" stroke="${NX}" stroke-width="1.5" marker-end="url(#arr)"/>`;
  s+=`<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="${NX}"/></marker></defs>`;
  s+=`<text x="95" y="240" text-anchor="middle" font-size="8" fill="${WN}">zero-copy offload at JNI boundary</text>`;
  s+=`<text x="95" y="252" text-anchor="middle" font-size="8" fill="${NX}">libnullnxbridge.so</text>`;
  return wrap(s);
}
function tHamming(){
  let s='';
  const bits=[1,0,1,1,0,0,1,0];
  bits.forEach((b,i)=>{
    const x=20+i*20, y=30;
    s+=`<rect x="${x}" y="${y}" width="17" height="17" rx="2" fill="${b?NX:'#0a2020'}" opacity="${b?.7:.3}" stroke="${NX2}" stroke-width=".5"/>`;
    s+=`<text x="${x+8.5}" y="${y+12}" text-anchor="middle" font-size="9" fill="#fff">${b}</text>`;
  });
  s+=`<text x="95" y="22" text-anchor="middle" font-size="7" fill="${DIM}">DATA WORD (8 bits)</text>`;
  const parity=[0,1,0,1,1];
  s+=`<text x="95" y="70" text-anchor="middle" font-size="7" fill="${WN}">+ HAMMING PARITY BITS</text>`;
  parity.forEach((b,i)=>{
    const x=35+i*24, y=75;
    s+=`<rect x="${x}" y="${y}" width="17" height="17" rx="2" fill="${WN}" opacity="${b?.5:.15}" stroke="${WN}" stroke-width=".8"/>`;
    s+=`<text x="${x+8.5}" y="${y+12}" text-anchor="middle" font-size="9" fill="#fff">${b}</text>`;
  });
  s+=`<rect x="15" y="115" width="160" height="30" rx="3" fill="#0a2020" stroke="${NX}" stroke-width="1"/>`;
  s+=`<text x="95" y="131" text-anchor="middle" font-size="8" fill="${NX}">10110010 01011</text>`;
  s+=`<text x="95" y="143" text-anchor="middle" font-size="7" fill="${DIM}">data + parity → encoded</text>`;
  s+=`<rect x="40" y="165" width="110" height="50" rx="3" fill="#0a0a20" stroke="${CR}" stroke-width="1"/>`;
  s+=`<text x="95" y="182" text-anchor="middle" font-size="8" fill="${CR}">1-BIT ERROR DETECTED</text>`;
  s+=`<text x="95" y="196" text-anchor="middle" font-size="8" fill="${NX}">↓ auto-corrected</text>`;
  s+=`<text x="95" y="208" text-anchor="middle" font-size="7" fill="${DIM}">no retransmit needed</text>`;
  s+=`<text x="95" y="245" text-anchor="middle" font-size="7" fill="${WN}">wraps any NullNX payload byte</text>`;
  s+=`<text x="95" y="258" text-anchor="middle" font-size="7" fill="${DIM}">ideal for 1GB drone storage</text>`;
  return wrap(s);
}
function tOffload(){
  let s='';
  s+=`<rect x="15" y="20" width="130" height="100" rx="4" fill="#0a2020" stroke="${RB}" stroke-width="1"/>`;
  s+=`<text x="80" y="55" text-anchor="middle" font-size="9" fill="${RB}">FULL COMPUTE STATE</text>`;
  s+=`<text x="80" y="70" text-anchor="middle" font-size="8" fill="${DIM}">60 nodes × 90 edges</text>`;
  s+=`<text x="80" y="83" text-anchor="middle" font-size="8" fill="${DIM}">32 faces × mission data</text>`;
  s+=`<text x="80" y="100" text-anchor="middle" font-size="7" fill="${WN}">~14,400 bytes in RAM</text>`;
  s+=`<text x="155" y="75" font-size="18" fill="${NX}">→</text>`;
  s+=`<rect x="155" y="40" width="25" height="60" rx="4" fill="#020408" stroke="${NX}" stroke-width="1.5"/>`;
  s+=`<text x="168" y="65" text-anchor="middle" font-size="7" fill="${NX}" transform="rotate(-90,168,65)">NullNX</text>`;
  s+=`<text x="168" y="110" text-anchor="middle" font-size="7" fill="${WN}">9B</text>`;
  s+=`<line x1="168" y1="102" x2="168" y2="140" stroke="${NX}" stroke-width="1" stroke-dasharray="3,2"/>`;
  s+=`<text x="95" y="155" text-anchor="middle" font-size="8" fill="${NX}">INSTANT RELOAD</text>`;
  s+=`<text x="95" y="167" text-anchor="middle" font-size="7" fill="${DIM}">stream → expand → full state</text>`;
  s+=`<text x="95" y="179" text-anchor="middle" font-size="7" fill="${DIM}">in microseconds</text>`;
  s+=`<rect x="15" y="200" width="160" height="50" rx="3" fill="#0a2020" stroke="${NX2}" stroke-width=".8"/>`;
  s+=`<text x="95" y="220" text-anchor="middle" font-size="8" fill="${NX2}">MISSION QUEUE</text>`;
  for(let i=0;i<5;i++){
    s+=`<rect x="${25+i*30}" y="228" width="22" height="12" rx="2" fill="${i===2?NX:'#020408'}" stroke="${NX2}" stroke-width=".5"/>`;
    s+=`<text x="${36+i*30}" y="238" text-anchor="middle" font-size="6" fill="${i===2?'#000':DIM}">M${i+1}</text>`;
  }
  s+=`<text x="95" y="258" text-anchor="middle" font-size="7" fill="${WN}">swap any mission in/out instantly</text>`;
  return wrap(s);
}
function tMission(){
  let s='';
  const cmds=[{m:'0x10',label:'TAKEOFF',py:'1E',color:NX},
    {m:'0x11',label:'WAYPOINT',py:'26 00 69 00',color:NX2},
    {m:'0x11',label:'WAYPOINT',py:'27 01 6A 00',color:NX2},
    {m:'0x12',label:'LAND',py:'',color:WN},
    {m:'0x20',label:'RTL',py:'',color:CR}];
  cmds.forEach((c,i)=>{
    const y=18+i*46;
    s+=`<rect x="10" y="${y}" width="170" height="38" rx="3" fill="#020408" stroke="${c.color}" stroke-width=".8"/>`;
    s+=`<text x="20" y="${y+14}" font-size="9" fill="${c.color}">${c.m}</text>`;
    s+=`<text x="55" y="${y+14}" font-size="9" fill="${WN}">${c.label}</text>`;
    s+=`<text x="20" y="${y+28}" font-size="8" fill="${DIM}">payload: ${c.py||'—'}</text>`;
    if(i<cmds.length-1)s+=`<line x1="95" y1="${y+38}" x2="95" y2="${y+46}" stroke="${DIM}" stroke-width=".8" stroke-dasharray="2,2"/>`;
  });
  s+=`<text x="95" y="252" text-anchor="middle" font-size="8" fill="${NX}">total: 13 bytes</text>`;

   demo:{label:'Telemetry frame',stream:'03 19 5C 1E',expand:'→ temp: 25°C | batt: 92%\n→ alt: 30m | spd: 8m/s\n→ frame size: 8 bytes'}}
];

const GROUPS=[
  {id:'all',label:'ALL CARDS'},
  {id:'genesis',label:'GENESIS'},
  {id:'core',label:'CORE ENGINE'},
  {id:'bridge',label:'JNI & OFFLOAD'},
  {id:'graph',label:'GRAPH & MESH'},
  {id:'storage',label:'STORAGE & REF'}
];

function buildFilterBar(){
  const bar=document.getElementById('filterbar');
  GROUPS.forEach(g=>{
    const btn=document.createElement('button');
    btn.className=`fbtn ${g.id==='all'?'on':''}`;
    btn.textContent=g.label;
    btn.onclick=()=>filterCards(g.id,btn);
    bar.appendChild(btn);
  });
}

function filterCards(groupId,btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderDeck(groupId);
}

function renderDeck(filterGroup){
  const deck=document.getElementById('deck');
  deck.innerHTML='';
  CARDS.forEach(c=>{
    if(filterGroup!=='all' && c.group!==filterGroup) return;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="inner" style="--spd:${c.spd}s;">
        <div class="face">
          ${c.tess()}
          <div class="ftitle">
            <span class="marker">${c.key} · ${c.group.toUpperCase()}</span>
            <b>${c.title}</b>
            <i>${c.sub}</i>
          </div>
        </div>
        <div class="face back">
          <div class="btitle">${c.key} — ${c.title}</div>
          <div class="bdesc">
            <b>${c.h}</b><br>${c.text}
            <div class="demo">
              <div style="font-size:.6rem;color:var(--dim);">${c.demo.label}</div>
              <div class="stream">0x ${c.demo.stream}</div>
              <div class="expand">${c.demo.expand.replace(/\n/g,'<br>')}</div>
            </div>
          </div>
          <button class="mbtn" onclick="event.stopPropagation();this.closest('.card').classList.remove('flipped');">↩ FLIP BACK</button>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle('flipped');
    deck.appendChild(card);
  });
}

window.onload=()=>{
  buildFilterBar();
  renderDeck('all');
};
</script>
</body>
</html>
